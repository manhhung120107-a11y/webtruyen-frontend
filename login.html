<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tủ Truyện</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        body.dark-mode .login-box { background: #252525; }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #5d4037;
            color: #fff;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn-login:hover { background: #4a332c; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #5d4037; margin-bottom: 20px;">Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button class="btn-login" id="btn-submit">Vào Đọc Truyện</button>
        <p style="margin-top: 20px; font-size: 14px;">
            Chưa có tài khoản? <a href="register.html" style="color: #5d4037; font-weight: bold;">Đăng ký thành viên</a>
        </p>
        <p id="error-msg" style="color: red; margin-top: 15px; display: none;"></p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
