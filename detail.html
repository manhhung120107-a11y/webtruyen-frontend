<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Truyện Chi Tiết</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="nav-bar">
        <button id="btn-back">⬅️ Tủ Truyện</button>
        <h3 id="nav-story-title" class="hidden"></h3>
        
        <div class="nav-right">
            <button id="btn-sync">🔄 Đồng bộ</button>
            <button id="btn-theme">🌙 Giao diện Tối</button>
        </div>
    </div>

    <div class="reader-container">
        
        <div class="detail-box">
            <div class="story-info-header">
                <h1 id="story-title">Tên Truyện</h1>
                
                <div class="story-meta-item">
                    <strong>✍️ Tác giả:</strong> <span id="story-author">Đang tải...</span>
                </div>
                
                <div class="story-meta-item">
                    <strong>🏷️ Thể loại:</strong> <span id="story-genre" class="genre-tag">Đang tải...</span>
                </div>
                
                <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <button id="btn-read-first">Đọc Từ Đầu</button>
                        <button id="btn-read-continue">Đọc Tiếp</button>
                    </div>
                    <button id="btn-delete-story">🗑️ Xóa truyện này</button>
                </div>
            </div>
            
            <div class="divider" style="margin: 20px 0;"></div>
            
            <h3 style="color: #5d4037; margin-bottom: 8px;">📝 Tóm tắt nội dung:</h3>
            <p id=\"story-summary\" class=\"summary-text\">Đang tải tóm tắt truyện...</p>
        </div>

        <h3 style="color: #5d4037; margin-bottom: 15px; padding-left: 5px;">📑 Danh sách chương</h3>
        <div class="chapter-scroll-box">
            <ul id="chapter-list">
                </ul>
        </div>
    </div>

    <script src="js/detail.js"></script>
</body>
</html>
