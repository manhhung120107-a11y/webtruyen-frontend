<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Truyện Của Tôi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="nav-bar">
        <h2>📚 Tủ Truyện</h2>
        
        <div class="nav-right">
            <button id="btn-open-modal" class="btn-primary">➕ Thêm truyện</button>
            <button id="btn-theme" class="btn-outline">🌙 Diện Tối</button>
            
            <div class="user-menu-container">
                <button id="btn-dropdown-arrow" class="user-profile-wrapper">
                    <span class="user-avatar">👤</span>
                    <span class="arrow-icon">▼</span>
                </button>
                
                <div id="user-dropdown" class="dropdown-content hidden">
                    <div id="user-info-name" class="dropdown-username">Hi, Admin!</div>
                    <div class="divider"></div>
                    <a href="#" id="menu-history" class="dropdown-item">📚 Lịch sử đọc</a>
                    <div class="divider"></div>
                    <a href="#" id="menu-logout" class="dropdown-item logout-item">🚪 Đăng xuất</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="story-list" class="story-grid"></div>
    </div>

    <div id="story-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <span id="btn-close-modal" class="modal-close-btn">&times;</span>
            <h3>➕ Thêm Bộ Truyện Mới</h3>
            
            <div class="modal-form-group">
                <label>Tên truyện <span class="required">*</span></label>
                <input type="text" id="add-title" placeholder="Nhập tên bộ truyện...">
            </div>
            <div class="modal-form-group">
                <label>Google Doc ID <span class="required">*</span></label>
                <input type="text" id="add-doc-id" placeholder="Ví dụ: 1a2b3c4d5e...">
            </div>
            <div class="modal-form-group">
                <label>Tác giả</label>
                <input type="text" id="add-author" placeholder="Tên tác giả (nếu có)...">
            </div>
            <div class="modal-form-group">
                <label>Thể loại</label>
                <input type="text" id="add-genre" placeholder="Ví dụ: Đô Thị, Huyền Huyễn...">
            </div>
            <div class="modal-form-group">
                <label>Mô tả / Tóm tắt ngắn</label>
                <textarea id="add-description" placeholder="Nội dung tóm tắt sơ lược..." rows="3"></textarea>
            </div>
            
            <button id="btn-add-story" class="btn-submit">Lưu và Thêm Truyện</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
