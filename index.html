<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Truyện Của Tôi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="nav-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
        <h2>📚 Tủ Truyện</h2>
        
        <div class="nav-right" style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-theme">🌙 Giao diện Tối</button>
            
            <div class="user-menu-container">
                <div class="user-profile-wrapper">
                    <span class="user-avatar">👤</span>
                    <button id="btn-dropdown-arrow" class="dropdown-arrow">▼</button>
                </div>
                
                <div id="user-dropdown" class="dropdown-content hidden">
                    <div id="user-info-name" class="dropdown-username">Hi, Admin!</div>
                    <div class="divider"></div>
                    <a href="#" id="menu-history">📚 Lịch sử đọc</a>
                    <div class="divider"></div>
                    <a href="#" id="menu-logout" style="color: #ef4444 !important;">🚪 Đăng xuất</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container" style="padding: 20px;">
        <div id="admin-add-section" style="margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
            <h3>➕ Thêm Truyện Mới</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <input type="text" id="add-title" placeholder="Tên truyện">
                <input type="text" id="add-author" placeholder="Tác giả">
                <input type="text" id="add-genre" placeholder="Thể loại">
                <input type="text" id="add-doc-id" placeholder="Google Doc ID">
                <input type="text" id="add-description" placeholder="Mô tả">
                <button id="btn-add-story">Thêm Truyện</button>
            </div>
        </div>

        <div id="story-list" class="story-grid"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
